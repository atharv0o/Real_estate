services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: realestate
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d realestate"]
      interval: 5s
      timeout: 5s
      retries: 20

  rag_engine:
    build:
      context: .
      dockerfile: docker/rag.Dockerfile
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/realestate
      POSTGRES_DB: realestate
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      VECTOR_DIM: 384
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8001:8001"

  blockchain:
    build:
      context: .
      dockerfile: docker/blockchain.Dockerfile
    environment:
      ALGORAND_MNEMONIC: ${ALGORAND_MNEMONIC:-}
      ALGOD_ADDRESS: ${ALGOD_ADDRESS:-https://testnet-api.algonode.cloud}
      ALGOD_TOKEN: ${ALGOD_TOKEN:-}
      INDEXER_ADDRESS: ${INDEXER_ADDRESS:-https://testnet-idx.algonode.cloud}
      INDEXER_TOKEN: ${INDEXER_TOKEN:-}
      APP_ID: ${APP_ID:-}
      ALGORAND_NODE_URL: ${ALGORAND_NODE_URL:-https://testnet-api.algonode.cloud}
      ALGORAND_NODE_TOKEN: ${ALGORAND_NODE_TOKEN:-}
    ports:
      - "8002:8002"

  backend:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/realestate
      POSTGRES_DB: realestate
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      RAG_API: http://rag_engine:8001
      RAG_QUERY_URL: http://rag_engine:8001/rag-query
      RAG_REFRESH_URL: http://rag_engine:8001/refresh-index
      BLOCKCHAIN_API: http://blockchain:8002
      BLOCKCHAIN_TIMEOUT_SECONDS: 3
      BLOCKCHAIN_RETRIES: 1
      LOG_LEVEL: INFO
    depends_on:
      postgres:
        condition: service_healthy
      rag_engine:
        condition: service_started
      blockchain:
        condition: service_started
    ports:
      - "8000:8000"

  data_pipeline:
    build:
      context: .
      dockerfile: docker/data_pipeline.Dockerfile
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/realestate
      POSTGRES_DB: realestate
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      RAG_REFRESH_URL: http://rag_engine:8001/refresh-index
      BLOCKCHAIN_SERVICE_URL: http://blockchain:8002/verify
      LOG_LEVEL: INFO
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    depends_on:
      backend:
        condition: service_started
    ports:
      - "3000:3000"
