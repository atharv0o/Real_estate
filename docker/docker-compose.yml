version: "3.9"

services:
  postgres:
    image: postgres:15
    container_name: real_estate_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: real_estate
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d real_estate"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ..
      dockerfile: docker/backend.Dockerfile
    container_name: backend
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8000:8000"
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: real_estate
      RAG_API: http://rag_engine:8001
      RAG_QUERY_URL: http://rag_engine:8001/rag-query
      RAG_REFRESH_URL: http://rag_engine:8001/refresh-index
      BLOCKCHAIN_API: http://blockchain:8002
      BLOCKCHAIN_TIMEOUT_SECONDS: 3
      BLOCKCHAIN_RETRIES: 1

  frontend:
    build:
      context: ..
      dockerfile: docker/frontend.Dockerfile
    container_name: frontend
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    depends_on:
      - backend

  rag_engine:
    build:
      context: ..
      dockerfile: docker/rag.Dockerfile
    container_name: rag_engine
    ports:
      - "8001:8001"
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_DB: real_estate
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    depends_on:
      postgres:
        condition: service_healthy

  blockchain:
    build:
      context: ..
      dockerfile: docker/blockchain.Dockerfile
    container_name: blockchain
    ports:
      - "8002:8002"
    environment:
      ALGORAND_MNEMONIC: ${ALGORAND_MNEMONIC:-}
      ALGOD_ADDRESS: ${ALGOD_ADDRESS:-https://testnet-api.algonode.cloud}
      ALGOD_TOKEN: ${ALGOD_TOKEN:-}
      INDEXER_ADDRESS: ${INDEXER_ADDRESS:-https://testnet-idx.algonode.cloud}
      INDEXER_TOKEN: ${INDEXER_TOKEN:-}
      APP_ID: ${APP_ID:-}
      ALGORAND_NODE_URL: ${ALGORAND_NODE_URL:-https://testnet-api.algonode.cloud}
      ALGORAND_NODE_TOKEN: ${ALGORAND_NODE_TOKEN:-}
    restart: unless-stopped

volumes:
  pg_data:
